name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CE_LIVE_TEST: "0"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python "3.14"

      - name: Verify release tag matches package version
        run: |
          uv run --locked --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from ce_analyzer_mcp import __version__

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          if __version__ != version:
              raise SystemExit(
                  f"package runtime version {__version__!r} does not match "
                  f"pyproject.toml version {version!r}"
              )
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match package version {version!r}; "
                  f"expected {expected_tag!r}"
              )
          PY

      - name: Check Ruff formatting
        run: uv run --locked --no-sync ruff format --check .

      - name: Run Ruff lint
        run: uv run --locked --no-sync ruff check .

      - name: Run mypy
        run: uv run --locked --no-sync mypy

      - name: Check MCP tools snapshot
        run: uv run --locked --no-sync python -m ce_analyzer_mcp.tool_snapshot --check

      - name: Run offline tests with branch coverage
        run: >-
          uv run --locked --no-sync pytest -m "not live"
          --cov=ce_analyzer_mcp
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build source and wheel distributions
        run: uv run --locked --no-sync python -m build

      - name: Check distribution metadata
        run: uv run --locked --no-sync twine check dist/*

      - name: Create clean wheel environment from lockfile
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uv venv --python "3.14" "${RUNNER_TEMP}/wheel-smoke"
          uv pip sync --require-hashes --python "${RUNNER_TEMP}/wheel-smoke/bin/python" \
            "${RUNNER_TEMP}/runtime-requirements.txt"
          uv pip install --python "${RUNNER_TEMP}/wheel-smoke/bin/python" \
            --no-deps dist/*.whl

      - name: Smoke-test built wheel
        run: |
          "${RUNNER_TEMP}/wheel-smoke/bin/python" - <<'PY'
          from importlib.metadata import version

          import ce_analyzer_mcp

          assert ce_analyzer_mcp.__version__ == version("ce-analyzer-mcp")
          PY
          "${RUNNER_TEMP}/wheel-smoke/bin/ce-analyzer-mcp" --version
          "${RUNNER_TEMP}/wheel-smoke/bin/python" \
            -m ce_analyzer_mcp.tool_snapshot --check mcp-tools.json

      - name: Upload release distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ce-analyzer-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

  publish-github:
    name: Create GitHub Release
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.whl dist/*.tar.gz
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "ce-analyzer-mcp ${GITHUB_REF_NAME#v}"
